<!DOCTYPE html>

<style>

canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bar{position:fixed;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:5px;z-index:5;pointer-events:none}
.bar>*{pointer-events:auto}
#top{top:calc(8px + env(safe-area-inset-top,0px))}
#bot{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
button{background:var(--p);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#1a1000;border-color:var(--ac);font-weight:600}
.box{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:5px 10px;display:flex;align-items:center;gap:6px}
.box label{color:var(--mu);font-size:11px;white-space:nowrap}.box span{font-size:11px;min-width:54px;color:var(--tx)}
input[type=range]{accent-color:var(--ac);width:96px}
#panel{position:fixed;right:8px;top:calc(118px + env(safe-area-inset-top,0px));width:300px;max-height:calc(100% - 232px);overflow:auto;background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:12px;z-index:6;display:none}
#panel h2{margin:0;font-size:19px}.sub{color:var(--mu);font-size:11px}
h3{margin:10px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:4px}.g div{background:rgba(255,255,255,.05);border-radius:7px;padding:4px 7px}
.g small{display:block;color:var(--mu);font-size:10px}
.fact{color:#c8d1ea;margin:8px 0}
.sl{display:grid;grid-template-columns:62px 1fr 46px;gap:6px;align-items:center;margin:5px 0;color:var(--mu);font-size:11px}
.sl input{width:100%}.sl b{color:var(--tx);text-align:right}
.lab{position:fixed;left:0;top:0;font-size:11px;color:rgba(232,236,248,.85);pointer-events:none;transform:translate(-50%,-150%);text-shadow:0 0 4px #000;z-index:2}
#tbl{position:fixed;left:8px;right:8px;top:calc(118px + env(safe-area-inset-top,0px));z-index:7;background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:10px;display:none;overflow:auto;max-height:55%}
table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}th,td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--ln)}th{color:var(--ac)}td:first-child,th:first-child{text-align:left}
@media(max-width:700px){#panel{top:auto;left:8px;right:8px;width:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px));max-height:40%}}
